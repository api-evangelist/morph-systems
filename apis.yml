name: Morph Systems
description: 'Morph Systems is a Palo Alto, California based artificial intelligence
  consultancy that accelerates enterprise adoption of Palantir Foundry and AIP by
  building LLM-powered operating systems on top of an organization''s data and ontology.
  Founded by forward-deployed engineers who began by supporting military aviation
  with an LLM-based kneeboard system that generates mission briefs from integrated
  airport and flight data, the company now delivers AI-driven operating systems for
  trading firms, LLM-powered supply-chain visibility for large-scale factory construction,
  and patient-experience and operations solutions built on the Palantir platform.
  Morph Systems is an early-stage, venture-backed team (backed by 500 Global, Seoul
  National University, Mashup Ventures, Orange Planet Foundation, and the Tech Incubator
  Program for Startup / TIPS) that operates as a services and solutions provider rather
  than a public API platform; it does not currently publish a developer portal, API
  reference, SDKs, or a public API surface.'
